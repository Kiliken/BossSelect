fast_forward_speed = 2
recent_files = []

[audio]
resampler = "cubic"
volume = 100
mp2k_hle_enable = false
mp2k_hle_cubic = true
mp2k_hle_force_reverb = true

[input]
controller_guid = ""
hold_fast_forward = true
fast_forward = [32, -1, -1, -1, 0]

[input.gba]
a = [74, -1, -1, -1, 0]
r = [73, -1, -1, -1, 0]
down = [83, -1, -1, -1, 0]
right = [68, -1, -1, -1, 0]
select = [16777219, -1, -1, -1, 0]
b = [75, -1, -1, -1, 0]
start = [16777220, -1, -1, -1, 0]
up = [87, -1, -1, -1, 0]
left = [65, -1, -1, -1, 0]
l = [85, -1, -1, -1, 0]

[general]
bios_path = "gba_bios.bin"
bios_skip = false
save_folder = "saves"

[cartridge]
save_type = "detect"
solar_sensor_level = 23
force_rtc = true
force_solar_sensor = false

[video]
filter = "lcd1x"
color_correction = "none"
lcd_ghosting = true

[window]
scale = 3
fullscreen = false
maximum_scale = 0
fullscreen_show_menu = false
lock_aspect_ratio = true
use_integer_scaling = false
show_fps = false
pause_emulator_when_inactive = true

