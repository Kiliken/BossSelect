fast_forward_speed = 2
recent_files = []

[audio]
resampler = "cubic"
volume = 100
mp2k_hle_enable = false
mp2k_hle_cubic = true
mp2k_hle_force_reverb = true

[input]
controller_guid = ""
hold_fast_forward = true
fast_forward = [32, -1, -1, -1, 0]

[input.gba]
a = [65, -1, -1, -1, 0]
r = [70, -1, -1, -1, 0]
down = [16777237, -1, -1, -1, 0]
right = [16777236, -1, -1, -1, 0]
select = [16777219, -1, -1, -1, 0]
b = [83, -1, -1, -1, 0]
start = [16777220, -1, -1, -1, 0]
up = [16777235, -1, -1, -1, 0]
left = [16777234, -1, -1, -1, 0]
l = [68, -1, -1, -1, 0]

[general]
bios_path = "gba_bios.bin"
bios_skip = false
save_folder = "saves"

[cartridge]
save_type = "detect"
solar_sensor_level = 23
force_rtc = true
force_solar_sensor = false

[video]
filter = "nearest"
color_correction = "agb"
lcd_ghosting = true

[window]
scale = 2
fullscreen = false
maximum_scale = 0
fullscreen_show_menu = false
lock_aspect_ratio = true
use_integer_scaling = false
show_fps = false
pause_emulator_when_inactive = true

